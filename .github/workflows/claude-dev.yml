name: Claude Code Agent

on:
  issues:
    types: [labeled]

jobs:
  claude-code:
    if: github.event.label.name == 'work_in_progress'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - print label name
        run: echo "Label added was -> ${{ github.event.label.name }}"

      - name: Run Claude Code Agent
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
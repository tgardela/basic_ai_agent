name: Claude Code Agent

on:
  issues:
    types: [labeled]

jobs:
  claude-code:
    if: github.event.label.name == 'work_in_progress'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Agent
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-6"
          trigger_phrase: ""
          direct_prompt: |
            Issue Title: ${{ github.event.issue.title }}
            
            Issue Description:
            ${{ github.event.issue.body }}
            
            Instructions:
            - Read the issue title and description carefully
            - Make the required code changes in the repository
            - Create a pull request with your changes
            - Title the PR: "${{ github.event.issue.title }}"
            - Reference issue #${{ github.event.issue.number }} in the PR body